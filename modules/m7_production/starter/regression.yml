# Runs the pipeline on the CI sample and fails the build when ATE regresses.
# The dev image is the one ci.yml builds: ghcr.io/<owner>/slam-onboarding-dev:<hash of infra/docker/**>.
name: regression

on:
  pull_request:

jobs:
  image-tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${{ hashFiles('infra/docker/**') }}" >> "$GITHUB_OUTPUT"

  regression:
    needs: image-tag
    runs-on: ubuntu-24.04
    container: ghcr.io/${{ github.repository_owner }}/slam-onboarding-dev:${{ needs.image-tag.outputs.tag }}
