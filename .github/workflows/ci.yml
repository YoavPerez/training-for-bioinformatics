name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # The dev image is tagged with the hash of infra/docker. It is built only when that tag is missing, so trainee
  # repositories created from the template reuse the image instead of rebuilding it (~30 min) and pushing.
  image:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')  # image names must be lowercase
          echo "image=ghcr.io/${owner}/slam-onboarding-dev:${{ hashFiles('infra/docker/**') }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:  # ghcr packages are private by default
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # setarch -R (ASan workaround in module 0b) and gdb need personality()/ptrace, blocked by the default profile.
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4
      - run: infra/ci/lint.sh

  smoke:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:  # ghcr packages are private by default
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # setarch -R (ASan workaround in module 0b) and gdb need personality()/ptrace, blocked by the default profile.
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4
      - run: infra/ci/build.sh . build
      - run: ctest --test-dir build -L '^smoke$' --output-on-failure
      - run: pip install -e . && pytest -q pipeline/python/tests

  # One job per module. Modules you have not finished yet are red; that is expected.
  module:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:  # ghcr packages are private by default
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # setarch -R (ASan workaround in module 0b) and gdb need personality()/ptrace, blocked by the default profile.
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        module: [m0, m0b, m1, m2, m3, m4, m4b, m5, m6, m7, m8]
    name: module ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: data/samples
          key: kitti-sample-${{ hashFiles('data/download.py') }}
      - run: python data/download.py --sample
      - run: pip install -e .
      - run: infra/ci/test_module.sh ${{ matrix.module }}
