name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/slam-onboarding-dev

jobs:
  image:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${{ hashFiles('infra/docker/**') }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/slam-onboarding-dev:${{ needs.image.outputs.tag }}
      # setarch -R (ASan workaround in module 0b) and gdb need personality()/ptrace, blocked by the default profile.
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4
      - run: infra/ci/lint.sh

  smoke:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/slam-onboarding-dev:${{ needs.image.outputs.tag }}
      # setarch -R (ASan workaround in module 0b) and gdb need personality()/ptrace, blocked by the default profile.
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4
      - run: infra/ci/build.sh . build
      - run: ctest --test-dir build -L '^smoke$' --output-on-failure
      - run: pip install -e . && pytest -q pipeline/python/tests

  # One job per module. Modules you have not finished yet are red; that is expected.
  module:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/slam-onboarding-dev:${{ needs.image.outputs.tag }}
      # setarch -R (ASan workaround in module 0b) and gdb need personality()/ptrace, blocked by the default profile.
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        module: [m0, m0b, m1, m2, m3, m4, m4b, m5, m6, m7, m8]
    name: module ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: data/samples
          key: kitti-sample-${{ hashFiles('data/download.py') }}
      - run: python data/download.py --sample
      - run: pip install -e .
      - run: infra/ci/test_module.sh ${{ matrix.module }}
